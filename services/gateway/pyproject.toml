[project]
name = "gateway"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "bcrypt>=4.0",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "itsdangerous>=2.1",
    "media_tools_ui",
    "spotify_dl",
    "yt_bulk_dl",
    "edl_to_archive",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.uv.sources]
media_tools_ui = { workspace = true }
spotify_dl = { workspace = true }
yt_bulk_dl = { workspace = true }
edl_to_archive = { workspace = true }

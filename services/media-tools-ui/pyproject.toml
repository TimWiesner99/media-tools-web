[project]
name = "media-tools-ui"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["media_tools_ui"]
include = [
    "media_tools_ui/static/**/*",
    "media_tools_ui/templates/**/*.html",
]
[project]
name = "spotify_dl"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "media_tools_ui",
    "spotifyscraper>=2.1.5",
    "yt-dlp>=2023.12.30",
    "musicbrainzngs>=0.7.1",
    "ffmpeg-python>=0.2.0",
    "youtube-search>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "job_runner.py",
    "main.py",
    "router.py",
    "settings.py",
    "core",
    "templates",
]

[tool.hatch.build.targets.wheel.sources]
"" = "spotify_dl"

[tool.uv.sources]
media_tools_ui = { workspace = true }

[project]
name = "media_tools_ui"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "templating.py",
    "static",
    "templates",
]

[tool.hatch.build.targets.wheel.sources]
"" = "media_tools_ui"
[project]
name = "yt_bulk_dl"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "media_tools_ui",
    "yt-dlp>=2026.2.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
only-include = [
    "__init__.py",
    "job_runner.py",
    "main.py",
    "router.py",
    "settings.py",
    "core",
    "templates",
]

[tool.hatch.build.targets.wheel.sources]
"" = "yt_bulk_dl"

[tool.uv.sources]
media_tools_ui = { workspace = true }
